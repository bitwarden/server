name: Build Gov

on:
  push:
     branches:
       - "main"
       - "rc"
       - "hotfix-rc"
  workflow_dispatch:

env:
  _REGISTRY: "bwfedrampdev.azurecr.io"
  _TAG_SUFFIX: "-gov"

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0

      - name: Verify format
        run: dotnet format --verify-no-changes

  build-artifacts:
    name: Build Docker images
    runs-on: ubuntu-22.04
    needs: lint
    permissions:
      security-events: write
      id-token: write
      contents: read
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - project_name: Admin
            base_path: ./src
          - project_name: Api
            base_path: ./src
          - project_name: Billing
            base_path: ./src
          - project_name: Events
            base_path: ./src
          - project_name: EventsProcessor
            base_path: ./src
          - project_name: Icons
            base_path: ./src
          - project_name: Identity
            base_path: ./src
          - project_name: MsSqlMigratorUtility
            base_path: ./util
          - project_name: Notifications
            base_path: ./src
          - project_name: Scim
            base_path: ./bitwarden_license/src
          - project_name: Sso
            base_path: ./bitwarden_license/src
    steps:
      - name: Check out repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Get version
        id: version
        run: |
          VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate image tags
        id: image-tags
        env:
          SHA: ${{ github.sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          BRANCH_NAME=$(echo "${GITHUB_REF#refs/heads/}" | sed "s#/#-#g")
          PROJECT_NAME=$(echo "${{ matrix.project_name }}" | tr '[:upper:]' '[:lower:]')

          case "$BRANCH_NAME" in
            main)
              # tag images on main with 'dev' and short sha
              SHORT_SHA=$(git rev-parse --short "${SHA}")
              TAGS="${_REGISTRY}/${PROJECT_NAME}:dev${_TAG_SUFFIX}"
              TAGS=$TAGS",${_REGISTRY}/${PROJECT_NAME}:dev-${SHORT_SHA}${_TAG_SUFFIX}"
              ;;
            rc)
              # tag RC images with the project version number
              TAGS="${_REGISTRY}/${PROJECT_NAME}:${VERSION}${_TAG_SUFFIX}"
              ;;
            hotfix-rc)
              # tag hotfix-rc images with the project version number
              TAGS="${_REGISTRY}/${PROJECT_NAME}:${VERSION}${_TAG_SUFFIX}"
              ;;
            *)
              TAGS="${_REGISTRY}/${PROJECT_NAME}:${BRANCH_NAME:0:124}${_TAG_SUFFIX}"
              ;;
          esac

          SCAN_TAG=$(echo "${TAGS}" | cut -f 1 -d ',')
          echo "scan_tag=$SCAN_TAG" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Verify Dockerfile exists
        run: |
          DOCKERFILE="${{ matrix.base_path }}/${{ matrix.project_name }}/gov.Dockerfile"
          if [[ ! -f "$DOCKERFILE" ]]; then
            echo "::error::Dockerfile not found: $DOCKERFILE"
            exit 1
          fi
      
      - name: Print environment
        run: |
          whoami
          echo "GitHub ref: $GITHUB_REF"
          echo "GitHub event: $GITHUB_EVENT"
          echo "Project: ${{ matrix.project_name }}"

      - name: Set up QEMU emulators
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Azure
        uses: bitwarden/gh-actions/azure-login@main
        with:
          subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          client_id: ${{ secrets.AZURE_CLIENT_ID }}

      - name: Get registry secrets from Key Vault
        # unused in testing, but testing retrieval step
        id: get-kv-secrets
        uses: bitwarden/gh-actions/get-keyvault-secrets@main
        with:
          keyvault: gh-org-bitwarden
          secrets: >-
            GAMEWARDEN-REGISTRY-USERNAME,
            GAMEWARDEN-REGISTRY-PASSWORD,
            CHAINGUARD-REGISTRY-USERNAME,
            CHAINGUARD-REGISTRY-PASSWORD

      - name: Log in to registry
        # use ACR for testing
        run: az acr login -n bwfedrampdev

      - name: Log out from Azure
        uses: bitwarden/gh-actions/azure-logout@main

      - name: Log in to Chainguard registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: cgr.dev
          username: ${{ steps.get-kv-secrets.outputs.CHAINGUARD-REGISTRY-USERNAME }}
          password: ${{ steps.get-kv-secrets.outputs.CHAINGUARD-REGISTRY-PASSWORD }}

      - name: Build Docker image
        id: build-artifacts
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.base_path }}/${{ matrix.project_name }}/gov.Dockerfile
          platforms: "linux/amd64"
          push: true
          tags: ${{ steps.image-tags.outputs.tags }}

      - name: Scan Docker image
        id: container-scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ${{ steps.image-tags.outputs.scan_tag }}
          fail-build: false
          output-format: sarif

      - name: Log out from the registries
        run: |
          docker logout ${_REGISTRY}
          docker logout cgr.dev

      - name: Upload Grype results to GitHub
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: ${{ steps.container-scan.outputs.sarif }}
          sha: ${{ github.sha }}
          ref: ${{ github.ref }}
