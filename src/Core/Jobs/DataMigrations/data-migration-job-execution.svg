<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1166" viewBox="0 0 1240 1166" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="call" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#4E8BF5"/>
    </marker>
    <marker id="ret" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8" fill="none" stroke="#8B93A5" stroke-width="1.4"/>
    </marker>
    <marker id="loopback" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2CBF7C"/>
    </marker>
  </defs>

  <rect width="1240" height="1166" fill="#131A29"/>

  <text x="40" y="42" fill="#FFFFFF" font-size="21" font-weight="700">One firing of DataMigrationsJob</text>
  <text x="40" y="66" fill="#8B93A5" font-size="12.5">flag-gated · drains until done · resumable at every checkpoint</text>

  <!-- lifeline headers -->
  <g font-size="13" font-weight="600" text-anchor="middle">
    <rect x="45" y="90" width="150" height="42" rx="7" fill="#1B2438" stroke="#175DDC" stroke-width="1.4"/>
    <text x="120" y="108" fill="#FFFFFF">Quartz</text>
    <text x="120" y="125" fill="#8B93A5" font-size="10.5" font-weight="400">every 15 min</text>

    <rect x="270" y="90" width="170" height="42" rx="7" fill="#1B2438" stroke="#175DDC" stroke-width="1.4"/>
    <text x="355" y="108" fill="#FFFFFF">DataMigrationsJob</text>
    <text x="355" y="125" fill="#8B93A5" font-size="10.5" font-weight="400">firings may overlap — capped drains</text>

    <rect x="530" y="90" width="180" height="42" rx="7" fill="#1B2438" stroke="#4E8BF5" stroke-width="1.4"/>
    <text x="620" y="108" fill="#FFFFFF">Migration engine</text>
    <text x="620" y="125" fill="#8B93A5" font-size="10.5" font-weight="400">× M, concurrent</text>

    <rect x="815" y="90" width="170" height="42" rx="7" fill="#1B2438" stroke="#E8A33D" stroke-width="1.4"/>
    <text x="900" y="108" fill="#FFFFFF">State table</text>
    <text x="900" y="125" fill="#8B93A5" font-size="10.5" font-weight="400">row per partition</text>

    <rect x="1050" y="90" width="150" height="42" rx="7" fill="#1B2438" stroke="#2CBF7C" stroke-width="1.4"/>
    <text x="1125" y="108" fill="#FFFFFF">Target table</text>
    <text x="1125" y="125" fill="#8B93A5" font-size="10.5" font-weight="400">e.g. OrganizationApiKey</text>
  </g>

  <!-- lifelines -->
  <g stroke="#2A3550" stroke-width="1.4" stroke-dasharray="5 5">
    <line x1="120" y1="132" x2="120" y2="1056"/>
    <line x1="355" y1="132" x2="355" y2="1056"/>
    <line x1="620" y1="132" x2="620" y2="1056"/>
    <line x1="900" y1="132" x2="900" y2="1056"/>
    <line x1="1125" y1="132" x2="1125" y2="1056"/>
  </g>

  <!-- fire + fan out -->
  <line x1="120" y1="176" x2="355" y2="176" stroke="#4E8BF5" stroke-width="1.8" marker-end="url(#call)"/>
  <text x="237" y="168" fill="#E4E9F2" font-size="12" text-anchor="middle">Execute</text>

  <line x1="355" y1="216" x2="620" y2="216" stroke="#4E8BF5" stroke-width="1.8" marker-end="url(#call)"/>
  <text x="487" y="208" fill="#E4E9F2" font-size="12" text-anchor="middle">RunAsync — all migrations at once</text>

  <line x1="620" y1="252" x2="367" y2="252" stroke="#E5654F" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ret)"/>
  <text x="490" y="245" fill="#E5654F" font-size="11" text-anchor="middle">feature flag off → return</text>

  <!-- first run -->
  <g>
    <rect x="540" y="278" width="660" height="128" rx="6" fill="none" stroke="#2A3550" stroke-width="1.2"/>
    <path d="M540,278 h44 v14 l-8,8 h-36 z" fill="#2A3550"/>
    <text x="550" y="293" fill="#E4E9F2" font-size="10.5" font-weight="600">opt</text>
    <text x="596" y="292" fill="#8B93A5" font-size="10.5">[first run]</text>

    <line x1="620" y1="324" x2="1125" y2="324" stroke="#4E8BF5" stroke-width="1.8" marker-end="url(#call)"/>
    <text x="870" y="316" fill="#E4E9F2" font-size="12" text-anchor="middle">count C · sample key at i·C/N  × (N−1)</text>

    <line x1="620" y1="372" x2="900" y2="372" stroke="#4E8BF5" stroke-width="1.8" marker-end="url(#call)"/>
    <text x="758" y="364" fill="#E4E9F2" font-size="12" text-anchor="middle">insert N partition ranges + row counts</text>
    <text x="758" y="392" fill="#8B93A5" font-size="10.5" text-anchor="middle">one INSERT · unique index = init mutex</text>
  </g>

  <!-- pending tally -->
  <line x1="620" y1="440" x2="900" y2="440" stroke="#4E8BF5" stroke-width="1.8" marker-end="url(#call)"/>
  <text x="758" y="432" fill="#E4E9F2" font-size="12" text-anchor="middle">tally pending_rows gauge — total − scanned, per partition</text>
  <text x="758" y="460" fill="#8B93A5" font-size="10.5" text-anchor="middle">every firing · leased partitions included</text>

  <!-- claim -->
  <line x1="620" y1="500" x2="900" y2="500" stroke="#4E8BF5" stroke-width="1.8" marker-end="url(#call)"/>
  <text x="758" y="492" fill="#E4E9F2" font-size="12" text-anchor="middle">claim partitions × MaxParallelBatches</text>
  <line x1="900" y1="530" x2="632" y2="530" stroke="#8B93A5" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ret)"/>
  <text x="758" y="523" fill="#8B93A5" font-size="10.5" text-anchor="middle">lease + cursor · null → nothing to do</text>

  <!-- drain loop -->
  <g>
    <rect x="510" y="556" width="700" height="384" rx="6" fill="#151E31" stroke="#4E8BF5" stroke-width="1.4"/>
    <path d="M510,556 h48 v15 l-8,8 h-40 z" fill="#4E8BF5"/>
    <text x="520" y="572" fill="#FFFFFF" font-size="10.5" font-weight="700">loop</text>
    <text x="570" y="571" fill="#8B93A5" font-size="10.5">drain each claimed partition — one batch per pass</text>

    <line x1="620" y1="612" x2="1125" y2="612" stroke="#175DDC" stroke-width="1.8" marker-end="url(#call)"/>
    <text x="870" y="604" fill="#E4E9F2" font-size="12" text-anchor="middle">read window beyond cursor — candidates only</text>

    <path d="M620,644 h64 v24 h-52" fill="none" stroke="#4E8BF5" stroke-width="1.6" marker-end="url(#call)"/>
    <text x="696" y="658" fill="#E4E9F2" font-size="12">shape rows <tspan fill="#8B93A5" font-size="10.5">— bad row: count it, keep going</tspan></text>

    <line x1="620" y1="708" x2="1125" y2="708" stroke="#175DDC" stroke-width="1.8" marker-end="url(#call)"/>
    <text x="855" y="700" fill="#E4E9F2" font-size="12" text-anchor="middle">write batch — CAS per row, one txn</text>
    <rect x="1136" y="697" width="76" height="20" rx="10" fill="#2CBF7C"/>
    <text x="1174" y="711" fill="#0E1524" font-size="10.5" font-weight="700" text-anchor="middle">commit ①</text>
    <text x="870" y="728" fill="#8B93A5" font-size="10.5" font-family="ui-monospace, Menlo, monospace" text-anchor="middle">WHERE Id = @Id AND ApiKey = @Original</text>

    <line x1="620" y1="768" x2="900" y2="768" stroke="#E8A33D" stroke-width="1.8" marker-end="url(#call)"/>
    <text x="748" y="760" fill="#E4E9F2" font-size="12" text-anchor="middle">checkpoint cursor + totals</text>
    <rect x="912" y="757" width="66" height="20" rx="10" fill="#E8A33D"/>
    <text x="945" y="771" fill="#0E1524" font-size="10.5" font-weight="700" text-anchor="middle">② after ①</text>
    <text x="758" y="788" fill="#E8A33D" font-size="10.5" text-anchor="middle">fenced by owner · renews lease · refreshes gauge</text>

    <!-- outcomes -->
    <line x1="536" y1="814" x2="1186" y2="814" stroke="#2A3550" stroke-width="1" stroke-dasharray="3 4"/>
    <g font-size="11.5">
      <text x="560" y="844" fill="#2CBF7C">●</text>
      <text x="580" y="844" fill="#E4E9F2">end of range → partition done · last one logs “migration completed”</text>
      <text x="560" y="872" fill="#4E8BF5">●</text>
      <text x="580" y="872" fill="#E4E9F2">more to do → next batch, same claim</text>
      <text x="560" y="900" fill="#E5654F">●</text>
      <text x="580" y="900" fill="#E4E9F2">fenced out · error · flag off → stop; next firing resumes from checkpoint</text>
    </g>
    <path d="M545,868 H526 V620 h80" fill="none" stroke="#2CBF7C" stroke-width="1.6" stroke-dasharray="7 4" marker-end="url(#loopback)"/>
  </g>

  <!-- release + done -->
  <line x1="620" y1="974" x2="900" y2="974" stroke="#E8A33D" stroke-width="1.8" marker-end="url(#call)"/>
  <text x="758" y="966" fill="#E4E9F2" font-size="12" text-anchor="middle">finally: release lease (fenced)</text>

  <line x1="355" y1="1018" x2="132" y2="1018" stroke="#8B93A5" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ret)"/>
  <text x="237" y="1011" fill="#8B93A5" font-size="10.5" text-anchor="middle">done — next firing picks up any remainder</text>

  <!-- invariants -->
  <g font-size="11">
    <rect x="40" y="1080" width="360" height="40" rx="8" fill="#1B2438" stroke="#2CBF7C" stroke-width="1"/>
    <text x="56" y="1105" fill="#E4E9F2"><tspan fill="#2CBF7C" font-weight="700">crash-safe</tspan>  lease expires → resume from checkpoint</text>

    <rect x="418" y="1080" width="360" height="40" rx="8" fill="#1B2438" stroke="#E8A33D" stroke-width="1"/>
    <text x="434" y="1105" fill="#E4E9F2"><tspan fill="#E8A33D" font-weight="700">ordering</tspan>  commit ① strictly before checkpoint ②</text>

    <rect x="796" y="1080" width="404" height="40" rx="8" fill="#1B2438" stroke="#175DDC" stroke-width="1"/>
    <text x="812" y="1105" fill="#E4E9F2"><tspan fill="#4E8BF5" font-weight="700">one switch</tspan>  same feature flag everywhere, re-read every batch</text>
  </g>
</svg>
